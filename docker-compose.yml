services:
  db:
    image: postgres:17-alpine
    container_name: stockdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: stockdesk
      POSTGRES_PASSWORD: stockdesk
      POSTGRES_DB: stockdesk
      # 日本語データを扱うので照合順序を明示しておく
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432" # ホスト側で 5432 が既に使われていても衝突しないようずらす
    volumes:
      - stockdesk-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockdesk -d stockdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stockdesk-pgdata:
